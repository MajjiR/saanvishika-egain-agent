services:
  - type: web
    name: saanvishika-agent-actions
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: OWNER_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
