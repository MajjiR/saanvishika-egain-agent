# Render's free tier sleeps after 15 idle minutes; a cold start can outlast an
# eGain action timeout. Ping /health every 10 minutes while judging runs.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.SERVICE_URL }}/health" || true
